name: Build TeinTools APK

on:
  push:
    paths:
      - 'input/TeinTools-v1.zip.b64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teintools-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android 10 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AndroidForge repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null
          yes | sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Decode TeinTools source archive
        run: |
          base64 --decode input/TeinTools-v1.zip.b64 > "$RUNNER_TEMP/TeinTools.zip"
          mkdir -p "$RUNNER_TEMP/TeinTools"
          unzip -q "$RUNNER_TEMP/TeinTools.zip" -d "$RUNNER_TEMP/TeinTools"
          test -s "$RUNNER_TEMP/TeinTools/app/src/main/java/com/teinzz/teintools/MainActivity.java"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compile debug APK
        run: gradle -p "$RUNNER_TEMP/TeinTools" --no-daemon assembleDebug

      - name: Verify APK
        run: test -s "$RUNNER_TEMP/TeinTools/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TeinTools-Android10-debug
          path: ${{ runner.temp }}/TeinTools/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
