name: Build Game Nuke APK

on:
  push:
    paths:
      - 'projects/GameNuke/.build-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gamenuke-apk-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p projects/GameNuke --no-daemon --stacktrace assembleDebug
          APK="projects/GameNuke/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/GameNuke.apk
          echo "APK_SIZE_BYTES=$(stat -c %s release/GameNuke.apk)"
          sha256sum release/GameNuke.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameNuke-APK
          path: release/GameNuke.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish direct APK download
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: GameNuke-APK
          path: release
      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamenuke-v1.0.0-${{ github.run_number }}
          name: Game Nuke v1.0.0 · Build ${{ github.run_number }}
          body: |
            Game Nuke — Nuke Engine Omni Booster.
            Android 10+ debug APK. Shizuku is required for shell-backed tweaks. Kernel controls depend on device support.
          files: release/GameNuke.apk
          make_latest: true
