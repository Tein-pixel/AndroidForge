name: Build Game Nuke APK

on:
  push:
    paths:
      - 'build-input/GameNuke-Source.zip.b64'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gamenuke-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    container: ghcr.io/professional-x/androidforge-build-env:latest
    timeout-minutes: 40
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
      - name: Decode and build
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p /tmp/gamenuke-source release
          base64 -d build-input/GameNuke-Source.zip.b64 > /tmp/GameNuke-Source.zip
          unzip -q /tmp/GameNuke-Source.zip -d /tmp/gamenuke-source
          ROOT="$(find /tmp/gamenuke-source -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then echo 'settings.gradle.kts not found'; exit 2; fi
          echo "Project root: $ROOT"
          java -version
          gradle --version
          gradle -p "$ROOT" --no-daemon --stacktrace assembleDebug
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" release/GameNuke.apk
          echo "APK_SIZE_BYTES=$(stat -c %s release/GameNuke.apk)"
          sha256sum release/GameNuke.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameNuke-APK
          path: release/GameNuke.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish direct APK download
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: GameNuke-APK
          path: release
      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamenuke-v1.0.0-${{ github.run_number }}
          name: Game Nuke v1.0.0 · Build ${{ github.run_number }}
          body: |
            Game Nuke — Nuke Engine Omni Booster

            Android 10+ debug APK. Shizuku is required for shell-backed tweaks. Kernel controls depend on device support.
            Download GameNuke.apk from this release's Assets section.
          files: release/GameNuke.apk
          make_latest: true
